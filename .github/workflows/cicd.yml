name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-management-server
  CONTAINER: wms-backend

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: self-hosted
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the image built by this run
        run: docker pull "${IMAGE}:${{ github.sha }}"

      - name: Stop the previous container
        run: docker rm -f "${CONTAINER}" || true

      - name: Run the new container
        run: |
          docker run -d \
            --name "${CONTAINER}" \
            --restart unless-stopped \
            -p 4000:4000 \
            -e NODE_ENV="production" \
            -e PORT="4000" \
            -e HOST="0.0.0.0" \
            -e LOG_LEVEL="info" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}" \
            -e SIMULATION_AUTOSTART="true" \
            -e ARRIVAL_HORIZON_MINUTES="120" \
            "${IMAGE}:${{ github.sha }}"

      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health > /dev/null; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy — last 100 log lines:"
          docker logs --tail 100 "${CONTAINER}"
          exit 1

      - name: Remove dangling images
        if: always()
        run: docker image prune -f
